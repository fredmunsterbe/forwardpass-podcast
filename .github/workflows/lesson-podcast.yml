# .github/workflows/lesson-podcast.yml
# Daily: turn MONTESSORI's Daily Lesson on Drive into a ~12-15 min two-voice tutorial episode
# (tutor + curious AI champion) on the same Transistor show as the daily brief.
name: Daily AI Lesson Podcast

on:
  schedule:
    # Target: episode on Spotify before 08:30 Brussels, every day, summer and winter.
    # The lesson task runs at 05:37 Brussels (fixed local time) and lands on Drive ~06:00-06:15.
    # GitHub cron is UTC only, so we poll every 30 min from 03:10 to 06:40 UTC
    #   = 05:10-08:40 Brussels in summer time, 04:10-07:40 in winter
    # (early runs simply find no lesson for today and skip). The today-only + dedup guards
    # make sure exactly one episode is published per lesson. From LESSON_FALLBACK_HOUR
    # (07:00 Brussels) a missing spoken script is generated from the lesson HTML instead.
    #   12:40 UTC = 14:40 / 13:40 Brussels — late safety net if everything above missed.
    - cron: "10,40 3-6 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the lesson isn't today's, already has an episode, or has no spoken script yet"
        type: boolean
        default: false

concurrency:
  group: lesson-podcast
  cancel-in-progress: false

jobs:
  make-lesson-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install openai google-api-python-client google-auth requests mutagen
      - name: Make and publish the lesson episode
        env:
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          TRANSISTOR_API_KEY:        ${{ secrets.TRANSISTOR_API_KEY }}
          TRANSISTOR_SHOW_ID:        ${{ secrets.TRANSISTOR_SHOW_ID }}
          TRANSISTOR_SHOW_ID_LESSON: ${{ secrets.TRANSISTOR_SHOW_ID_LESSON }}   # optional; blank = same show
          GOOGLE_SA_JSON:            ${{ secrets.GOOGLE_SA_JSON }}
          LESSON_DRIVE_FOLDER_ID:    ${{ secrets.LESSON_DRIVE_FOLDER_ID }}      # optional; script has a default
          TTS_VOICE_A:               ${{ vars.TTS_VOICE_A }}                    # tutor (default marin)
          TTS_VOICE_B:               ${{ vars.TTS_VOICE_B }}                    # learner (default cedar)
          LESSON_TARGET_MINUTES:     ${{ vars.LESSON_TARGET_MINUTES }}
          LESSON_MODEL:              ${{ vars.LESSON_MODEL }}
          LESSON_FALLBACK_HOUR:      ${{ vars.LESSON_FALLBACK_HOUR || '7' }}   # Brussels hour; was 12
          FEEDBACK_EMAIL:            ${{ vars.FEEDBACK_EMAIL }}
          FORCE:                     ${{ inputs.force }}
          OUT_DIR:                   out
        run: python make_lesson_episode.py
      - name: Keep the MP3 for review (downloadable from the run page for 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-audio
          path: out/*.mp3
          if-no-files-found: ignore
          retention-days: 14
